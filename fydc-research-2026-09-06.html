<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FYDC 调研报告 2026-09-06</title>
<body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f6f6f6;color:#17224b"><p id="status" style="padding:2rem">正在加载 FYDC 调研报告…</p>
<script>
(async()=>{try{
const parts=["part-aa.b64","part-ab.b64","part-ac.b64","part-ad.b64","part-ae.b64","part-af.b64"];
const texts=await Promise.all(parts.map(async p=>{const r=await fetch('report-parts/fydc-research-2026-09-06/'+p);if(!r.ok)throw new Error(p);return r.text()}));
let size=0;const chunks=texts.map(t=>{const s=atob(t.trim());size+=s.length;return s});
const bytes=new Uint8Array(size);let offset=0;for(const s of chunks){for(let i=0;i<s.length;i++)bytes[offset++]=s.charCodeAt(i)}
document.open();document.write(new TextDecoder('utf-8').decode(bytes));document.close();
}catch(e){document.getElementById('status').textContent='报告加载失败，请刷新后重试。';console.error(e)}})();
</script>
